name: gulp-ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.4.0

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run Ghost 6 theme compatibility check
      run: pnpm test

    - name: Run build task
      run: pnpm exec gulp build

    - name: Run zip task
      run: pnpm exec gulp zip

    - name: Get package version
      id: package
      run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Upload versioned artifact
      uses: actions/upload-artifact@v4
      with:
        name: chapter-${{ steps.package.outputs.version }}.zip
        path: ${{ github.workspace }}/dist/chapter-${{ steps.package.outputs.version }}.zip

    - name: Upload latest artifact
      uses: actions/upload-artifact@v4
      with:
        name: chapter.zip
        path: ${{ github.workspace }}/dist/chapter.zip
