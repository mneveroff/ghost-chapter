name: gulp-ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm install

    - name: Run Ghost 6 theme compatibility check
      run: npm test

    - name: Run build task
      run: npx gulp build

    - name: Run zip task
      run: npx gulp zip

    - name: Get package version
      id: package
      run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Upload versioned artifact
      uses: actions/upload-artifact@v4
      with:
        name: chapter-${{ steps.package.outputs.version }}.zip
        path: ${{ github.workspace }}/dist/chapter-${{ steps.package.outputs.version }}.zip

    - name: Upload latest artifact
      uses: actions/upload-artifact@v4
      with:
        name: chapter.zip
        path: ${{ github.workspace }}/dist/chapter.zip
